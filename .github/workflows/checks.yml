name: Implementation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy Pillow pytorch-msssim
      - run: python -m unittest discover -s tests -v
      - run: python code/cxr_h6_adversarial.py unit-test
